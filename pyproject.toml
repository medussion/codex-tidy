[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-tidy"
version = "0.1.0"
description = "Journalled, restore-first maintenance for local Codex state"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["codex", "maintenance", "sqlite", "housekeeping"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
# Standard library only, on purpose: no supply chain to audit before an
# internal rollout, and nothing to install on a locked-down machine.
dependencies = []

[project.scripts]
codex-tidy = "codex_tidy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
codex_tidy = ["webui/*.html"]

[tool.setuptools.package-dir]
"" = "src"
